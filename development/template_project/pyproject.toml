[project]
name = "redistricting-project"
version = "0.1.0"
description = "A ready-to-run redistricting analysis project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "binary-ensemble>=2.0,<3",
    "click",
    "geopandas",
    "gerrychain>=1.0.0,<2",
    "gerrytools>=2.0.1,<3",
    "ipykernel",
    "ipywidgets",
    "matplotlib",
    "maup",
    "numpy",
    "pandas",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pyright"
]

[tool.ruff]
line-length = 100
