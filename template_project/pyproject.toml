[project]
name = "redistricting-project"
version = "0.1.0"
description = "A ready-to-run redistricting analysis project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "binary-ensemble>=1.0",
    "click",
    "docker",
    "gerrychain[geo]",
    "gerrytools",
    "ipykernel",
    "ipywidgets",
    "joblib",
    "joblib-progress",
    "jsonlines",
    "matplotlib",
    "maup",
    "numpy",
    "pandas",
    "seaborn",
]

[dependency-groups]
dev = [
    "black",
]
